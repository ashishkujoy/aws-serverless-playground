AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  insurance

  Sample SAM Template for insurance

Parameters:
  PowertoolsTraceEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Set to 'false' for local emulators (e.g. floci/LocalStack) that don't
      provide real X-Ray trace context, to silence Powertools Tracer's
      "Missing AWS Lambda trace data" errors on every AWS SDK call.

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3

    Tracing: Active
    # You can add LoggingConfig parameters such as the Logformat, Log Group, and SystemLogLevel or ApplicationLogLevel. Learn more here https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html#sam-function-loggingconfig.
    LoggingConfig:
      LogFormat: JSON
    Runtime: nodejs24.x
    Architectures:
    - x86_64
  Api:
    TracingEnabled: true
Resources:
  InsuranceUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-InsuranceUserPool'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true

  InsuranceUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AWS::StackName}-InsuranceUserPoolClient'
      UserPoolId: !Ref InsuranceUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  QuotesTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: !Sub '${AWS::StackName}-QuotesTable'
      PrimaryKey:
        Name: quoteId
        Type: String
      Tags:
        Name: QuotesTable

  QuotesFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: quotes/
      Handler: app.lambdaHandler
      Events:
        QuotesGetEvent:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /quotes/{quoteId}
            Method: get
        QuotesPostEvent:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /quotes
            Method: post
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt QuotesTable.Arn
      Environment:
        Variables:
          QUOTES_TABLE_NAME: !Ref QuotesTable
          POWERTOOLS_SERVICE_NAME: quotes
          POWERTOOLS_LOG_LEVEL: INFO
          POWERTOOLS_TRACE_ENABLED: !Ref PowertoolsTraceEnabled
    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
        - app.ts

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: auth/
      Handler: app.lambdaHandler
      Events:
        AuthSignupEvent:
          Type: Api
          Properties:
            Path: /auth/signup
            Method: post
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
              Resource: !GetAtt InsuranceUserPool.Arn
      Environment:
        Variables:
          USER_POOL_ID: !Ref InsuranceUserPool
          POWERTOOLS_SERVICE_NAME: auth
          POWERTOOLS_LOG_LEVEL: INFO
          POWERTOOLS_TRACE_ENABLED: !Ref PowertoolsTraceEnabled
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
        - app.ts

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  QuotesGetApi:
    Description: API Gateway endpoint URL for Prod stage for get Quotes function
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/quotes/"
  QuotesFunction:
    Description: Quotes Lambda Function ARN
    Value: !GetAtt QuotesFunction.Arn
  QuotesFunctionIamRole:
    Description: Implicit IAM Role created for Quotes function
    Value: !GetAtt QuotesFunctionRole.Arn
  UserPoolId:
    Description: Cognito User Pool ID for the insurance app
    Value: !Ref InsuranceUserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID for the insurance app
    Value: !Ref InsuranceUserPoolClient
